version: '3.8'

services:
  fruit-info:
    build: .

    ports:
      - "6000:6000"

    volumes:
      - /home/amuni/.env:./.env:ro
      - ./:./:ro

    env_file:
      - ./.env

    command: >
      bash -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn -w 4 --worker-class=gevent -b 0.0.0.0:6000 fruit_info.wsgi:application"

    restart: always
