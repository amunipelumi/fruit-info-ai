version: '3.8'

services:
  fruit-info:
    build: .

    ports:
      - "5500:5500"

    extra_hosts:
      - "host.docker.internal:host-gateway" 

    env_file:
      - /home/amuni/my_applications/.env
    
    volumes:
      - /home/amuni/my_applications/fruit-info-ai:/fruit-info-ai

    command: >
      bash -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn -w 4 --worker-class=gevent -b 0.0.0.0:5500 fruit_info.wsgi:application"

    restart: always
